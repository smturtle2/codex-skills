<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>World Simulator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="game-shell">
      <aside id="gameRail" class="game-rail" aria-label="플레이어와 세계 정보">
        <header class="rail-header">
          <span>모험 기록</span>
          <button id="railClose" class="rail-close" type="button" aria-label="모험 기록 닫기">×</button>
        </header>
        <div id="characterSheet" class="character-sheet"></div>
        <nav class="rail-tabs" aria-label="모험 정보">
          <button class="rail-tab active" type="button" data-panel="character" aria-selected="true">인물</button>
          <button class="rail-tab" type="button" data-panel="world" aria-selected="false">세계</button>
        </nav>
        <div class="rail-detail">
          <section id="characterPanel" class="rail-panel active" aria-label="인물 상세"></section>
          <section id="worldContent" class="rail-panel world-content" aria-label="세계 정보"></section>
        </div>
      </aside>

      <main class="narrative-stage">
        <header class="story-header">
          <button id="railToggle" class="rail-toggle" type="button" aria-controls="gameRail" aria-expanded="false">모험 기록</button>
          <div class="story-heading">
            <h1 id="worldTitle">새로운 세계</h1>
            <p id="sceneTitle">세계를 구성하는 중</p>
          </div>
        </header>

        <section id="storyScroll" class="story-scroll" aria-label="이야기 기록">
          <div class="story-column">
            <button id="olderButton" class="older-button" type="button" hidden>이전 이야기 불러오기</button>
            <div id="timeline" class="timeline" aria-live="polite"></div>
            <div id="emptyState" class="empty-state">
              <h2>어떤 세계에서 시작할까요?</h2>
              <p>배경과 주인공, 원하는 분위기를 자유롭게 적어주세요.</p>
            </div>
          </div>
        </section>

        <footer class="command-dock">
          <div class="command-inner">
            <div class="command-caption">
              <span id="commandLabel">세계 구상</span>
              <span id="commandContext"></span>
            </div>
            <form id="composer" class="composer">
              <span id="commandMark" class="command-mark" aria-hidden="true">+</span>
              <label class="sr-only" for="worldInput">세계 설정 또는 행동 입력</label>
              <textarea id="worldInput" rows="1" placeholder="원하는 세계와 주인공을 설명하세요…"></textarea>
              <div class="composer-controls">
                <button id="beginButton" class="begin-button" type="button" hidden>모험 시작</button>
                <button id="sendButton" class="send-button" type="submit">전송</button>
              </div>
            </form>
            <div class="dock-footer">
              <span>Enter 전송 · Shift+Enter 줄바꿈</span>
              <span id="notice" class="notice" role="status"></span>
            </div>
          </div>
        </footer>
      </main>

      <button id="railScrim" class="rail-scrim" type="button" aria-label="모험 기록 닫기" tabindex="-1"></button>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
